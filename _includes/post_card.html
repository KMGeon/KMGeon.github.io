<article class="post-item">
  <h2 class="post-item-title">
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
  </h2>
  <div class="post-item-meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%Y / %m / %d" }}</time>
    {% if include.post.category %}<span class="dot">·</span><span class="post-item-cat">{{ include.post.category }}</span>{% endif %}
  </div>
  {% if include.post.excerpt %}
  <p class="post-item-excerpt">{{ include.post.excerpt | strip_html | truncate: 150 }}<a class="post-item-more" href="{{ include.post.url | relative_url }}">계속 읽기</a></p>
  {% endif %}
</article>

# ============================================================
#  Geon.archive — custom Tranquilpeak-style blog (no gem theme)
# ============================================================

# --- Site ---
title: Geon.archive
description: Server Development Blog
lang: ko
url: "https://kmgeon.github.io"
baseurl: ""

# --- Author / Profile (sidebar cover) ---
author:
  name: KMGeon
  bio: "Server Development Blog"
  avatar: /assets/img/commons/profile.jpg
  github: KMGeon
  url: "https://github.com/KMGeon"

# Repository (footer link)
gh_repo_url: "https://github.com/KMGeon/KMGeon.github.io"

# --- SEO / AEO ---
# Used by jekyll-seo-tag for OpenGraph, Twitter cards and JSON-LD.
logo: /assets/img/favicons/android-chrome-512x512.png
image: /assets/img/og-default.png            # default social-share image
keywords: "Spring Batch, Spring Boot, JPA, AWS, Redis, 서버 개발, 백엔드, 인프라, 기술 블로그"
twitter:
  card: summary_large_image
social:
  name: KMGeon
  links:
    - https://github.com/KMGeon

# --- Sidebar navigation ---
# Each item: name (label), url, icon (FontAwesome 6 class)
nav:
  - name: Home
    url: /
    icon: fa-solid fa-house
  - name: 태그
    url: /tags/
    icon: fa-solid fa-tags
  - name: 아카이브
    url: /archives/
    icon: fa-solid fa-box-archive
  - name: RSS
    url: /feed.xml
    icon: fa-solid fa-rss

# --- Build / Markdown ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

sass:
  style: compressed
  sass_dir: _sass

# --- Plugins ---
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Front-matter defaults ---
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.png
  - scope:
      path: "docs"
    values:
      seo:
        type: BlogPosting

# --- Exclude ---
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - .jekyll-cache
  - .omc
  - .omx
  - .claude
  - .idea
  - html-proofer
  - "*.gem"
  - "*.gemspec"
  - ".tmp-metadata.json"
  - ".tmp-inject.py"
